name: aquila-radio-astronomy
title: Aquila Radio Astronomy
summary: Hydrogen line and narrowband SETI search with a dish and an SDR
description: |
  This is a hydrogen line and narrowband SETI search software for a dish and an SDR. It works with Airspy, HydraSDR, RTL-SDR and HackRF, and both the hydrogen line and the search run together from the same SDR.

  For the hydrogen line it makes a calibrated spectrum of every scan. The calibration uses frequency switching, so there is no need for a 50 ohm terminator or a cold sky reference, but those can be used too. Every scan is kept in a table with its peak and velocity, and any old scan can be viewed again. There is also a sky map showing where the dish beam is, and a 3D plot of the line over several days.

  The narrowband search uses a fine FFT and a de-Doppler search in every block. Hits are listed with frequency, drift rate and SNR, with a waterfall plot. The search can be switched off to run hydrogen line only.

  The CSV tables, plots and spectra are saved, and the raw IQ samples can be saved too. The SDR tools are included, so nothing else needs to be installed. It can also show a dish that is running at another location over the network, for example a Raspberry Pi node at a remote dish.

  It is free and open source under the GPL-3 licence. The hydrogen line plots (raw) are made with Virgo.

  The snap needs the raw-usb interface to open the receiver. Connect it once after installing:
    sudo snap connect aquila-radio-astronomy:raw-usb
website: https://www.radioastronomy.in/
license: GPL-3.0-or-later
adopt-info: aquila
base: core24
confinement: strict
grade: stable
platforms:
  amd64:
  arm64:

apps:
  aquila-radio-astronomy:
    command: bin/aquila-gui
    extensions: [gnome]
    desktop: usr/share/applications/aquila-radio-astronomy.desktop
    plugs: [home, network, network-bind, raw-usb, removable-media]
    environment:
      PYTHONPATH: $SNAP/lib/python3.12/site-packages
  aquila:
    command: bin/aquila
    plugs: [home, network, network-bind, raw-usb, removable-media]
    environment:
      PYTHONPATH: $SNAP/lib/python3.12/site-packages

parts:
  aquila:
    plugin: python
    source: .
    python-packages: [".[gui,hline]"]
    build-packages: [python3-dev]
    stage-packages:
      - airspy
      - rtl-sdr
      - hackrf
      - libusb-1.0-0
      - python3-venv
      - usbutils
      # Qt's xcb platform plugin links these; the gnome platform snap lacks xcb-cursor
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xkb1
      - libxkbcommon-x11-0
    override-pull: |
      craftctl default
      craftctl set version="$(python3 -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("aquila/__init__.py").read()).group(1))')"
    override-build: |
      craftctl default
      install -D -m 644 packaging/linux/aquila-radio-astronomy.desktop \
        $CRAFT_PART_INSTALL/usr/share/applications/aquila-radio-astronomy.desktop
      install -D -m 644 aquila/assets/icon-256.png \
        $CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/aquila-radio-astronomy.png
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/aquila-radio-astronomy.png|' \
        $CRAFT_PART_INSTALL/usr/share/applications/aquila-radio-astronomy.desktop
