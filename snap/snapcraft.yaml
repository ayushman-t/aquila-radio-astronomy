name: aquila-radio-astronomy
title: Aquila Radio Astronomy
summary: Hydrogen line radio astronomy with a dish and an SDR
description: |
  Aquila Radio Astronomy is a desktop application for observing the 21 cm hydrogen line with a dish and a software defined radio. It runs with any dish, from a 0.9 m grid on a balcony to a multi-metre parabolic, and with the common low-cost receivers.

  The application controls the receiver, records the observation in blocks and produces a hydrogen line spectrum for each block, together with a map showing where the dish is pointing on the sky. Receiver calibration is part of the application: one reference measurement, taken with a 50 ohm terminator on the LNA or on a patch of cold sky, calibrates every scan that follows, and it can be repeated or removed at any time.

  An optional narrowband drift search can run on the same data. It applies a fine FFT across the whole band, performs a de-Doppler search in every block and records each hit with its drift rate, width and duration. When the search is switched off the application observes the hydrogen line only.

  Supported receivers are the Airspy, HydraSDR, RTL-SDR and HackRF. The receiver tools are bundled, so no separate installation is needed. Raw samples are never written to disk, memory use is fixed and disk use is capped, which allows the application to observe unattended for months. Several observing stations, for example a Raspberry Pi at a remote dish, can be followed from one copy of the application over the network.

  Aquila Radio Astronomy is free and open source under the MIT licence. The hydrogen line plots are produced with Virgo.

  The application needs the raw-usb interface to open the receiver. Connect it once after installing:
    sudo snap connect aquila-radio-astronomy:raw-usb
website: https://www.radioastronomy.in/
license: MIT
adopt-info: aquila
base: core24
confinement: strict
grade: stable
platforms:
  amd64:
  arm64:

apps:
  aquila-radio-astronomy:
    command: bin/aquila-gui
    extensions: [gnome]
    desktop: usr/share/applications/aquila-radio-astronomy.desktop
    plugs: [home, network, network-bind, raw-usb, removable-media]
    environment:
      PYTHONPATH: $SNAP/lib/python3.12/site-packages
  aquila:
    command: bin/aquila
    plugs: [home, network, network-bind, raw-usb, removable-media]
    environment:
      PYTHONPATH: $SNAP/lib/python3.12/site-packages

parts:
  aquila:
    plugin: python
    source: .
    python-packages: [".[gui,hline]"]
    build-packages: [python3-dev]
    stage-packages: [airspy, rtl-sdr, hackrf, libusb-1.0-0, python3-venv]
    override-pull: |
      craftctl default
      craftctl set version="$(python3 -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("aquila/__init__.py").read()).group(1))')"
    override-build: |
      craftctl default
      install -D -m 644 packaging/linux/aquila-radio-astronomy.desktop \
        $CRAFT_PART_INSTALL/usr/share/applications/aquila-radio-astronomy.desktop
      install -D -m 644 aquila/assets/icon-256.png \
        $CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/aquila-radio-astronomy.png
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/aquila-radio-astronomy.png|' \
        $CRAFT_PART_INSTALL/usr/share/applications/aquila-radio-astronomy.desktop
