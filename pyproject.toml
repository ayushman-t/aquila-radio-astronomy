[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aquila-radio-astronomy"
version = "0.2.5"
description = "Narrowband SETI survey and hydrogen line with a dish and an SDR"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ayushman Tripathi"}]
urls = {Homepage = "https://www.radioastronomy.in/"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
hline = ["astro-virgo"]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]

[project.scripts]
aquila = "aquila.cli:main"
aquila-gui = "aquila.cli:gui_entry"

[tool.setuptools.packages.find]
include = ["aquila*"]

[tool.setuptools.package-data]
aquila = ["assets/*.png", "assets/*.jpg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "C4"]
ignore = ["SIM115", "E402"]
